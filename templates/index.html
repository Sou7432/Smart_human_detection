<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Detection System</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 30px 20px;
        background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }

      header::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(34, 197, 94, 0.1) 50%,
          transparent 100%
        );
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      header h1 {
        font-size: 32px;
        font-weight: 600;
        position: relative;
        z-index: 1;
        letter-spacing: 0.5px;
      }

      header h1 span {
        font-size: 36px;
        margin-right: 10px;
        display: inline-block;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      .container {
        flex: 1;
        padding: 40px 20px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }

      .upload-section {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(34, 197, 94, 0.2);
        border-radius: 16px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      }

      .upload-section:hover {
        border-color: rgba(34, 197, 94, 0.4);
        box-shadow: 0 12px 40px rgba(34, 197, 94, 0.1);
      }

      .file-input-wrapper {
        position: relative;
        display: inline-block;
        margin-bottom: 20px;
      }

      input[type="file"] {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }

      .file-input-label {
        display: inline-block;
        padding: 12px 30px;
        background: rgba(59, 130, 246, 0.2);
        border: 2px dashed rgba(59, 130, 246, 0.5);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 16px;
      }

      .file-input-label:hover {
        background: rgba(59, 130, 246, 0.3);
        border-color: rgba(59, 130, 246, 0.8);
        transform: translateY(-2px);
      }

      .button-group {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 20px;
      }

      button {
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        border: none;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 10px;
        color: white;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }

      button:hover::before {
        width: 300px;
        height: 300px;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
      }

      button:active {
        transform: translateY(-1px);
      }

      .media-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 30px;
      }

      @media (min-width: 768px) {
        .media-container {
          grid-template-columns: 1fr 1fr;
        }
      }

      .media-wrapper {
        background: rgba(30, 41, 59, 0.4);
        border-radius: 16px;
        padding: 20px;
        border: 1px solid rgba(148, 163, 184, 0.1);
      }

      video,
      img {
        width: 100%;
        max-width: 100%;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        display: block;
        background: #1e293b;
      }

      video {
        min-height: 300px;
      }

      #result {
        min-height: 100px;
      }

      .status {
        margin-top: 30px;
        font-size: 24px;
        font-weight: 600;
        padding: 20px;
        border-radius: 12px;
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(10px);
        border: 2px solid transparent;
        transition: all 0.3s ease;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status.detected {
        border-color: rgba(34, 197, 94, 0.5);
        background: rgba(34, 197, 94, 0.1);
        animation: glow 2s infinite;
      }

      .status.not-detected {
        border-color: rgba(239, 68, 68, 0.5);
        background: rgba(239, 68, 68, 0.1);
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        50% {
          box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
        }
      }

      footer {
        padding: 20px;
        background: rgba(2, 6, 23, 0.8);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(148, 163, 184, 0.1);
        margin-top: auto;
      }

      .creator-signature {
        font-size: 14px;
        color: #94a3b8;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .creator-signature::before {
        content: "⚡";
        font-size: 16px;
        animation: sparkle 3s infinite;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 1;
          transform: rotate(0deg);
        }
        50% {
          opacity: 0.6;
          transform: rotate(180deg);
        }
      }

      .creator-signature strong {
        color: #22c55e;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .creator-signature:hover strong {
        color: #16a34a;
        text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
      }

      /* Loading spinner */
      .loading {
        display: none;
        width: 40px;
        height: 40px;
        border: 4px solid rgba(34, 197, 94, 0.1);
        border-top-color: #22c55e;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading.active {
        display: block;
      }
    </style>
  </head>

  <body>
    <header>
      <h1><span>👁️</span>Smart Human Presence Detection</h1>
    </header>

    <div class="container">
      <div class="upload-section">
        <div class="file-input-wrapper">
          <label class="file-input-label">
            📁 Choose Image File
            <input type="file" id="upload" accept="image/*" />
          </label>
        </div>

        <div class="button-group">
          <button onclick="detectImage()">🔍 Upload & Detect</button>
          <button onclick="startCamera()">📹 Open Camera</button>
          <button onclick="captureFrame()">📸 Detect From Camera</button>
        </div>
      </div>

      <div class="loading" id="loading"></div>

      <div class="media-container">
        <div class="media-wrapper">
          <video id="video" autoplay></video>
        </div>
        <div class="media-wrapper">
          <img id="result" />
        </div>
      </div>

      <div class="status" id="status">Ready to detect humans...</div>
    </div>

    <footer>
      <div class="creator-signature">
        Created by <strong>Soumya Mandal</strong>
      </div>
    </footer>

    <script>
      let video = document.getElementById("video");
      let loading = document.getElementById("loading");
      let statusDiv = document.getElementById("status");

      function startCamera() {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then((stream) => {
            video.srcObject = stream;
            statusDiv.innerText = "📹 Camera active - Ready to capture!";
            statusDiv.className = "status";
          })
          .catch((err) => {
            statusDiv.innerText = "❌ Camera access denied";
            statusDiv.className = "status not-detected";
          });
      }

      function detectImage() {
        let file = document.getElementById("upload").files[0];
        if (!file) {
          statusDiv.innerText = "⚠️ Please select an image first";
          statusDiv.className = "status not-detected";
          return;
        }
        loading.classList.add("active");
        statusDiv.innerText = "🔄 Processing image...";
        statusDiv.className = "status";

        let reader = new FileReader();
        reader.onload = () => sendToServer(reader.result);
        reader.readAsDataURL(file);
      }

      function captureFrame() {
        if (!video.srcObject) {
          statusDiv.innerText = "⚠️ Please open camera first";
          statusDiv.className = "status not-detected";
          return;
        }

        loading.classList.add("active");
        statusDiv.innerText = "🔄 Analyzing frame...";
        statusDiv.className = "status";

        let canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        sendToServer(canvas.toDataURL("image/jpeg"));
      }

      function sendToServer(imageData) {
        fetch("/detect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: imageData }),
        })
          .then((res) => res.json())
          .then((data) => {
            loading.classList.remove("active");
            document.getElementById("result").src =
              "data:image/jpeg;base64," + data.image;

            if (data.count > 0) {
              statusDiv.innerText = `✅ Humans Detected: ${data.count}`;
              statusDiv.className = "status detected";
            } else {
              statusDiv.innerText = "❌ No Human Detected";
              statusDiv.className = "status not-detected";
            }
          })
          .catch((err) => {
            loading.classList.remove("active");
            statusDiv.innerText = "❌ Detection failed - Please try again";
            statusDiv.className = "status not-detected";
          });
      }
    </script>
  </body>
</html>
